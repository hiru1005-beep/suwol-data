<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 데이터 보기</title>
<style>
:root{
  --bg:#F5F4EE; --card:#FFFFFF; --ink:#1E2A44; --soft:#5A6378; --line:#DDDCD2;
  --dot:#2F6FA8; --accent:#D9662B; --chip:#E4ECF5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{font-size:14px;color:var(--soft);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.tabs{display:flex;gap:0;margin:0 0 10px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.tabs button{border:0;border-radius:0;padding:9px 22px}
.tabs button.on{background:var(--dot);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.chips button{padding:7px 12px;font-size:14px}
.chips button.on{background:var(--dot);color:#fff;border-color:var(--dot)}
#bMean.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbl{max-height:62vh;overflow:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 5px;text-align:right;border-bottom:1px solid #ECEBE4;white-space:nowrap}
th{position:sticky;top:0;background:#EEF0F4;font-weight:700;text-align:center;white-space:normal;line-height:1.25;font-size:13px}
td.n,th.n{color:var(--soft);text-align:center;width:2.5em}
tr.avg td{background:#FFF4EC;font-weight:700;border-top:2px solid #F2C9AE}
.hint{font-size:15px;color:var(--soft);margin:12px 2px}
svg text{font-family:inherit}
.cell{cursor:pointer}
.cell:hover rect.bgc{fill:#EEF3F9}
#detail{margin-top:14px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.dhead b{font-size:17px;min-width:0}
.dhead button{white-space:nowrap;flex-shrink:0}
.msg{background:#FFF4EC;border:1px solid #F2C9AE;border-radius:12px;padding:12px;font-size:15px;margin-bottom:12px}
label.tog{display:flex;align-items:center;gap:8px;font-size:15px;margin:8px 2px}
input[type=checkbox]{width:20px;height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>우리 반 데이터 보기</h1>
  <div class="bar">
    <button id="bClass" class="on">우리 반</button>
    <button id="bPractice" hidden>연습용 200명</button>
    <button id="bReload">새로고침</button>
  </div>
  <p class="meta" id="meta">불러오는 중…</p>
  <div id="msg"></div>
  <div class="bar"><div class="tabs" role="tablist" style="margin:0"><button id="tTable" class="on">표</button><button id="tBar">막대</button><button id="tChart">점 그래프</button></div>
  <button id="bMean" aria-pressed="false">평균 보기</button></div>
  <div id="tableView"><div class="card tbl"><table id="tbl"></table></div>
  <p class="hint">한 줄이 한 사람의 답이에요. 숫자만 보고 가장 많은 답을 찾을 수 있나요? 다 봤으면 [막대]를 눌러요.</p></div>
  <div id="barView" hidden>
  <div class="chips" id="qChips"></div>
  <div class="card"><svg id="bars" width="100%" role="img" aria-label="막대그래프"></svg></div>
  <p class="hint" id="barNote"></p>
  </div>
  <div id="chartView" hidden>
  <div class="card"><svg id="mx" width="100%" role="img" aria-label="산점도 행렬"></svg></div>
  <p class="hint">칸을 누르면 그 두 질문만 크게 볼 수 있어요. 점 하나가 한 사람이에요.</p>
  <div id="detail" hidden>
    <div class="card">
      <div class="dhead"><b id="dTitle"></b><button id="dClose">닫기</button></div>
      <label class="tog"><input type="checkbox" id="bubble"> 겹친 점은 크게 (같은 답을 한 사람 수만큼)</label>
      <svg id="big" width="100%" role="img" aria-label="점 그래프"></svg>
      <p class="meta" id="dNote"></p>
    </div>
  </div>
  </div>
</div>

function parseCSV(t){
  t = t.replace(/^﻿/,"");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=""; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  const head=(rows.shift()||[]).map(s=>s.trim());
  const keep=head.map((h,i)=>i).filter(i=>head[i] && !/타임스탬프|timestamp/i.test(head[i]));
  const cols=keep.map(i=>head[i]);
  const recs=rows.map(r=>keep.map(i=>parseFloat(String(r[i]??"").replace(/[^0-9.\-]/g,""))))
                 .filter(r=>r.every(v=>Number.isFinite(v)));
  return {cols, recs};
}

function nice(lo,hi){
  if(lo===hi){lo-=1;hi+=1;}
  const span=hi-lo, pad=span*0.08;
  return [lo-pad, hi+pad];
}
function ticks(lo,hi,n){
  const raw=(hi-lo)/n, p=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(m=>m*p).find(s=>s>=raw);
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6));
  return out;
}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const fmt=v=>Math.abs(v)>=20?Math.round(v):Math.round(v*10)/10;
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

function drawMatrix(){
  const svg=document.getElementById("mx"); svg.innerHTML="";
  const {cols,recs}=data, n=cols.length;
  const W=svg.clientWidth||360, gap=4, cs=(W-gap*(n-1))/n;
  svg.setAttribute("height",W); svg.setAttribute("viewBox",`0 0 ${W} ${W}`);
  const ranges=cols.map((c,i)=>nice(Math.min(...recs.map(r=>r[i])),Math.max(...recs.map(r=>r[i]))));
  const r=Math.max(1.6,Math.min(3.2,cs/28));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const x0=j*(cs+gap), y0=i*(cs+gap);
    const g=el("g",{class:i===j?"":"cell",transform:`translate(${x0},${y0})`},svg);
    el("rect",{class:"bgc",width:cs,height:cs,rx:6,fill:i===j?"#EEF0F4":"#FAFAF7",stroke:"#DDDCD2"},g);
    if(i===j){
      const t=el("text",{x:cs/2,y:cs/2-2,"text-anchor":"middle","font-size":Math.max(10,Math.min(14,cs/7)),"font-weight":700,fill:"#1E2A44"},g);
      t.textContent=cols[i];
      if(!showMean){ t.setAttribute("y",cs/2+5); }
      else { const m=el("text",{x:cs/2,y:cs/2+Math.max(12,cs/6),"text-anchor":"middle","font-size":Math.max(9,Math.min(12,cs/9)),fill:"#B8521C","font-weight":700},g);
      m.textContent="평균 "+fmt(mean(recs.map(r=>r[i]))); }
      continue;
    }
    const [xl,xh]=ranges[j],[yl,yh]=ranges[i];
    for(const rec of recs){
      el("circle",{cx:((rec[j]-xl)/(xh-xl))*cs, cy:cs-((rec[i]-yl)/(yh-yl))*cs, r, fill:"#2F6FA8","fill-opacity":0.6},g);
    }
    g.addEventListener("click",()=>{sel=[j,i];drawDetail();document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});});
  }
}

function drawDetail(){
  if(!sel||!data) return;
  const [xi,yi]=sel, {cols,recs}=data;
  document.getElementById("detail").hidden=false;
  document.getElementById("dTitle").textContent=`가로: ${cols[xi]}  ·  세로: ${cols[yi]}`;
  const svg=document.getElementById("big"); svg.innerHTML="";
  const W=svg.clientWidth||340, H=Math.round(W*0.8), L=44, B=34, T=10, R=12;
  svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const [xl,xh]=nice(Math.min(...recs.map(r=>r[xi])),Math.max(...recs.map(r=>r[xi])));
  const [yl,yh]=nice(Math.min(...recs.map(r=>r[yi])),Math.max(...recs.map(r=>r[yi])));
  const X=v=>L+((v-xl)/(xh-xl))*(W-L-R), Y=v=>T+(1-(v-yl)/(yh-yl))*(H-T-B);
  for(const t of ticks(xl,xh,5)){ el("line",{x1:X(t),x2:X(t),y1:T,y2:H-B,stroke:"#ECEBE4"},svg); const s=el("text",{x:X(t),y:H-B+18,"text-anchor":"middle","font-size":12,fill:"#5A6378"},svg); s.textContent=t; }
  for(const t of ticks(yl,yh,5)){ el("line",{x1:L,x2:W-R,y1:Y(t),y2:Y(t),stroke:"#ECEBE4"},svg); const s=el("text",{x:L-6,y:Y(t)+4,"text-anchor":"end","font-size":12,fill:"#5A6378"},svg); s.textContent=t; }
  el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,stroke:"#9AA3B5"},svg);
  el("line",{x1:L,x2:L,y1:T,y2:H-B,stroke:"#9AA3B5"},svg);
  const big=document.getElementById("bubble").checked;
  const cnt=new Map(); for(const r of recs){const k=r[xi]+"|"+r[yi]; cnt.set(k,(cnt.get(k)||0)+1);}
  let maxc=0; cnt.forEach(v=>{if(v>maxc)maxc=v;});
  if(big){
    cnt.forEach((c,k)=>{const [a,b]=k.split("|").map(Number); el("circle",{cx:X(a),cy:Y(b),r:4+Math.sqrt(c)*4,fill:"#2F6FA8","fill-opacity":0.55,stroke:"#1E2A44","stroke-opacity":.25},svg);});
  } else {
    for(const r of recs) el("circle",{cx:X(r[xi]),cy:Y(r[yi]),r:5,fill:"#2F6FA8","fill-opacity":0.6},svg);
  }
  document.getElementById("dNote").textContent = maxc>1
    ? `같은 자리에 겹친 점이 있어요. 한 자리에 가장 많이 겹친 사람: ${maxc}명`
    : "겹친 점은 없어요.";
}

function drawTable(){
  const {cols,recs}=data, tb=document.getElementById("tbl");
  let h='<thead><tr><th class="n">#</th>'+cols.map(c=>'<th>'+c.replace('(','<br>(')+'</th>').join('')+'</tr></thead><tbody>';
  recs.forEach((r,i)=>{h+='<tr><td class="n">'+(i+1)+'</td>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>';});
  if(recs.length&&showMean) h+='<tr class="avg"><td class="n">평균</td>'+cols.map((c,i)=>'<td>'+fmt(mean(recs.map(r=>r[i])))+'</td>').join('')+'</tr>';
  tb.innerHTML=h+'</tbody>';
}
let view="table", showMean=false, barQ=0;
function bins(vals){
  const ints=vals.every(v=>Number.isInteger(v)), lo=Math.min(...vals), hi=Math.max(...vals);
  if(ints && hi-lo<=9){ const out=[]; const a=(lo>=1&&hi<=5)?1:lo, z=(lo>=1&&hi<=5)?5:hi; for(let v=a;v<=z;v++) out.push({lo:v,hi:v+1,label:String(v)}); return out; }
  const steps=[0.5,1,2,5,10,15,20,30,50,60,100,120,200,300,500];
  const step=steps.find(s=>(hi-lo)/s<=8)||1000;
  const out=[]; for(let v=Math.floor(lo/step)*step; v<=hi; v=+(v+step).toFixed(6)) out.push({lo:v,hi:+(v+step).toFixed(6),label:(ints&&step===1)?String(v):v+"~"});
  return out;
}
function drawBars(){
  if(!data||!data.recs.length){document.getElementById("bars").innerHTML="";return;}
  const {cols,recs}=data;
  const ch=document.getElementById("qChips"); ch.innerHTML="";
  cols.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;if(i===barQ)b.className="on";b.onclick=()=>{barQ=i;drawBars();};ch.appendChild(b);});
  const vals=recs.map(r=>r[barQ]), bs=bins(vals);
  bs.forEach(b=>b.n=vals.filter(v=>v>=b.lo&&v<b.hi).length);
  const max=Math.max(...bs.map(b=>b.n));
  const svg=document.getElementById("bars"); svg.innerHTML="";
  const W=svg.clientWidth||340, H=Math.round(W*0.75), L=8, R=8, T=44, B=40;
  svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const bw=(W-L-R)/bs.length, Y=n=>T+(1-n/max)*(H-T-B);
  el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,stroke:"#9AA3B5","stroke-width":2},svg);
  bs.forEach((b,k)=>{
    const x=L+k*bw+bw*0.12, w=bw*0.76;
    if(b.n) el("rect",{x,y:Y(b.n),width:w,height:H-B-Y(b.n),rx:4,fill:b.n===max?"#D9662B":"#9DBBD8"},svg);
    if(b.n){const c=el("text",{x:x+w/2,y:Y(b.n)-6,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#1E2A44"},svg);c.textContent=b.n+"명";}
    const l=el("text",{x:x+w/2,y:H-B+18,"text-anchor":"middle","font-size":Math.min(13,bw/3.2),fill:"#5A6378"},svg);l.textContent=b.label;
  });
  const top=bs.filter(b=>b.n===max).map(b=>b.label).join(", ");
  let note=`가장 많은 답: ${top} (${max}명). 주황 막대예요.`;
  if(showMean){
    const m=mean(vals), first=bs[0].lo, last=bs[bs.length-1].hi;
    const cat=bs.every(b=>b.hi-b.lo===1&&b.label===String(b.lo));
    const xm=cat? L+(m-first+0.5)*bw : L+((m-first)/(last-first))*(W-L-R);
    el("line",{x1:xm,x2:xm,y1:22,y2:H-B,stroke:"#B8521C","stroke-width":3,"stroke-dasharray":"7 5"},svg);
    const tx=el("text",{x:Math.min(Math.max(xm,40),W-40),y:16,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#B8521C"},svg); tx.textContent="평균 "+fmt(m);
    note+=` 점선이 평균(${fmt(m)})이에요.`;
  }
  document.getElementById("barNote").textContent=note;
}
function setView(v){view=v;
  for(const [id,k] of [["tTable","table"],["tBar","bar"],["tChart","chart"]]) document.getElementById(id).classList.toggle("on",v===k);
  document.getElementById("tableView").hidden=v!=="table";
  document.getElementById("barView").hidden=v!=="bar";
  document.getElementById("chartView").hidden=v!=="chart";
  if(!data) return;
  if(v==="bar") drawBars();
  if(v==="chart"){drawMatrix();drawDetail();}
}
document.getElementById("tTable").onclick=()=>setView("table");
document.getElementById("tBar").onclick=()=>setView("bar");
document.getElementById("tChart").onclick=()=>setView("chart");
document.getElementById("bMean").onclick=()=>{showMean=!showMean;
  const b=document.getElementById("bMean"); b.classList.toggle("on",showMean); b.setAttribute("aria-pressed",showMean); b.textContent=showMean?"평균 끄기":"평균 보기";
  if(data){drawTable(); if(view==="bar")drawBars(); if(view==="chart"){drawMatrix();drawDetail();}}};
function render(){
  const meta=document.getElementById("meta");
  meta.textContent = `${mode==="class"?"우리 반":"연습용 200명 (가상 데이터)"} · ${data.recs.length}명 · ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 기준`;
  drawTable(); if(view==="bar")drawBars(); if(view==="chart"){drawMatrix(); drawDetail();}
}
function showMsg(t){document.getElementById("msg").innerHTML=t?`<div class="msg">${t}</div>`:"";}

async function load(){
  showMsg("");
  if(mode==="practice"){ data=parseCSV(PRACTICE); render(); return; }
  if(!SRC){ showMsg("우리 반 시트 주소가 아직 연결되지 않았어요. 지금은 연습용 200명을 보여 줄게요."); mode="practice"; setBtns(); data=parseCSV(PRACTICE); render(); return; }
  document.getElementById("meta").textContent="우리 반 답을 불러오는 중…";
  try{
    const res=await fetch(SRC+(SRC.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const d=parseCSV(await res.text());
    if(d.recs.length<2){ showMsg("아직 답이 2명보다 적어요. 잠시 뒤 [새로고침]을 눌러 주세요."); }
    if(d.recs.length===0){ data={cols:d.cols.length?d.cols:parseCSV(PRACTICE).cols,recs:[]}; document.getElementById("meta").textContent="우리 반 · 0명"; document.getElementById("mx").innerHTML=""; drawTable(); return; }
    data=d; render();
  }catch(e){
    showMsg("우리 반 답을 불러오지 못했어요. 인터넷 연결을 확인하고 [새로고침]을 눌러 주세요.");
  }
}
function setBtns(){document.getElementById("bClass").classList.toggle("on",mode==="class");document.getElementById("bPractice").classList.toggle("on",mode==="practice");}
document.getElementById("bClass").onclick=()=>{mode="class";setBtns();sel=null;document.getElementById("detail").hidden=true;load();};
document.getElementById("bPractice").onclick=()=>{mode="practice";setBtns();sel=null;document.getElementById("detail").hidden=true;load();};
document.getElementById("bReload").onclick=load;
document.getElementById("dClose").onclick=()=>{sel=null;document.getElementById("detail").hidden=true;};
document.getElementById("bubble").onchange=drawDetail;
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>data&&render(),150);});
load();
</script>
</body>
